<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory of My Love</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .polaroid-frame { 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            transition: transform 0.3s ease;
        }
        .polaroid-frame:hover { transform: rotate(-1deg) scale(1.02); }
        
        /* Animasi Hati Melayang */
        .heart-bg {
            position: fixed;
            top: -10%;
            font-size: 20px;
            z-index: -1;
            user-select: none;
            animation: float 10s linear infinite;
            opacity: 0.3;
        }
        @keyframes float {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Animasi Putar untuk Tombol Musik */
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 4s linear infinite;
        }
    </style>
</head>
<body class="bg-[#fff5f7] text-slate-800 min-h-screen pb-24">

    <audio id="romantic-audio" autoplay muted loop>
        <source id="audio-source" src="Shape-Of-My-Heart.mp3" type="audio/mpeg">
        Browser kamu tidak mendukung pemutar audio.
    </audio>

    <div class="fixed bottom-24 right-6 z-50">
        <button id="music-toggle-btn" onclick="toggleMusic()" class="w-12 h-12 bg-white border border-rose-100 rounded-full flex items-center justify-center shadow-lg text-rose-500 transition-all active:scale-90">
            <svg id="icon-music-play" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
            <svg id="icon-music-pause" class="hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        </button>
    </div>

    <div id="heart-container"></div>

    <header class="p-10 text-center relative">
        <div class="inline-flex items-center justify-center p-3 bg-white rounded-2xl shadow-sm mb-4 relative">
            <span class="absolute -top-2 -right-2 text-xl">✨</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-rose-500 fill-rose-500 animate-pulse" viewBox="0 0 24 24" fill="currentColor"><path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3c1.74 0 3.122.95 3.954 2.126C12.474 3.95 13.857 3 15.596 3 18.57 3 21 5.322 21 8.25c0 3.734-2.26 6.815-4.57 9.12-1.93 1.93-3.6 2.924-4.232 3.235l-.022.012-.007.004-.002.001z"/></svg>
        </div>
        <h1 class="text-4xl font-serif font-black text-slate-800 tracking-tight">Memory of My Love</h1>
        <p class="text-rose-400 font-medium italic text-sm mt-2 flex items-center justify-center gap-2">
            <span>☁️</span> Every photo holds its own story <span>☁️</span>
        </p>
    </header>

    <main class="max-w-xl mx-auto px-6 py-4">
        <div id="home-view" class="space-y-6">
            <section class="bg-slate-800 text-white p-8 rounded-[2.5rem] shadow-2xl relative overflow-hidden">
                <span class="absolute top-4 right-4 text-3xl opacity-20">🎀</span>
                <span class="absolute bottom-4 left-4 text-3xl opacity-20">🌸</span>
                
                <div class="relative z-10">
                    <h2 class="text-2xl font-bold flex items-center gap-2">Hai Sayang! <span class="animate-bounce">❤️</span></h2>
                    <p class="text-slate-300 text-sm mt-3 leading-relaxed font-light">
                        Every memory we post here is a moment safely kept forever. 
                    </p>
                    <button onclick="openModal()" class="mt-6 px-8 py-3 bg-rose-500 hover:bg-rose-600 text-white text-[11px] font-bold rounded-full transition-all flex items-center gap-2 tracking-widest shadow-lg shadow-rose-500/30">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                        TAMBAH FOTO
                    </button>
                </div>
            </section>

            <div class="p-6 bg-white rounded-3xl border border-rose-100 text-center relative overflow-hidden">
                <span class="absolute -left-2 top-0 text-4xl opacity-10">💕</span>
                <p class="text-slate-500 italic text-sm">"You are the reason behind my smile every day."</p>
            </div>
        </div>

        <div id="album-view" class="hidden grid grid-cols-1 gap-12 pt-4 pb-10">
            </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-xl border-t border-rose-100 flex justify-around items-center h-20 z-50 px-6 shadow-[0_-10px_40px_rgba(255,182,193,0.2)]">
        <button onclick="switchView('home')" id="nav-home" class="flex flex-col items-center gap-1 text-rose-500 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-14"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span class="text-[9px] font-extrabold uppercase tracking-tighter">Beranda</span>
        </button>
        
        <div class="relative">
            <button onclick="openModal()" class="bg-rose-500 text-white p-4 rounded-2xl -mt-12 border-4 border-[#fff5f7] shadow-xl shadow-rose-500/40 active:scale-90 transition-transform">
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
        </div>

        <button onclick="switchView('album')" id="nav-album" class="flex flex-col items-center gap-1 text-slate-400 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
            <span class="text-[9px] font-extrabold uppercase tracking-tighter">Album</span>
        </button>
    </nav>

    <div id="modal-overlay" class="fixed inset-0 z-[100] hidden flex items-end sm:items-center justify-center bg-slate-900/40 backdrop-blur-sm">
        <div class="bg-white w-full max-w-lg rounded-t-[3rem] sm:rounded-[3rem] shadow-2xl overflow-hidden p-8 animate-in slide-in-from-bottom duration-300">
            <div class="flex justify-between items-center mb-6">
                <h2 id="modal-title" class="text-2xl font-black flex items-center gap-2">Momen Baru 🧸</h2>
                <button onclick="closeModal()" class="w-10 h-10 flex items-center justify-center bg-slate-50 rounded-full text-slate-400">✖</button>
            </div>
            <form id="memory-form" class="space-y-5">
                <input type="hidden" id="edit-id">
                <div onclick="document.getElementById('file-input').click()" class="relative aspect-video w-full rounded-[2rem] border-2 border-dashed border-rose-100 bg-rose-50/30 overflow-hidden flex flex-col items-center justify-center cursor-pointer group">
                    <div id="upload-placeholder" class="text-center group-hover:scale-110 transition-transform">
                        <span class="text-3xl mb-2 block">📸</span>
                        <p class="text-[10px] font-black text-rose-400 tracking-widest uppercase">Pilih Foto</p>
                    </div>
                    <img id="image-preview" class="hidden w-full h-full object-cover">
                    <input type="file" id="file-input" class="hidden" accept="image/*">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <input id="form-title" required type="text" placeholder="Berikan Judul..." class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-rose-200 outline-none">
                    <input id="form-date" required type="date" class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-rose-200 outline-none">
                </div>
                <textarea id="form-quote" required placeholder="Tulis pesan cintamu di sini..." class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-rose-200 outline-none resize-none h-24"></textarea>
                <button type="submit" id="submit-btn" class="w-full bg-slate-800 text-white py-5 rounded-3xl font-bold shadow-xl active:scale-95 transition-all uppercase tracking-widest text-xs">Simpan ke Cloud ✨</button>
            </form>
        </div>
    </div>

<script>
    const audio = document.getElementById('romantic-audio');
    const btn = document.getElementById('music-toggle-btn');
    const iconPlay = document.getElementById('icon-music-play');
    const iconPause = document.getElementById('icon-music-pause');

    // Fungsi untuk menyalakan/mematikan musik lewat tombol manual
    function toggleMusic() {
        if (audio.paused) {
            audio.muted = false; // Pastikan suara aktif saat di-play manual
            audio.play().then(() => {
                updateMusicUI(true);
            }).catch(err => console.log(err));
        } else {
            audio.pause();
            updateMusicUI(false);
        }
    }

    // Fungsi pembantu untuk mengubah tampilan tombol
    function updateMusicUI(isPlaying) {
        if (isPlaying) {
            iconPlay.classList.add('hidden');
            iconPause.classList.remove('hidden');
            btn.classList.add('animate-spin-slow', 'bg-rose-50');
        } else {
            iconPlay.classList.remove('hidden');
            iconPause.classList.add('hidden');
            btn.classList.remove('animate-spin-slow', 'bg-rose-50');
        }
    }

    // Trik Autoplay: Begitu user berinteraksi dengan layar (klik/sentuh), 
    // suara (unmute) akan langsung aktif otomatis tanpa merusak estetika.
    function activateAutoplay() {
        if (audio.paused || audio.muted) {
            audio.muted = false;
            audio.play().then(() => {
                updateMusicUI(true);
            }).catch(err => console.log("Menunggu interaksi pertama...", err));
        }
        // Hapus event listener setelah berhasil agar tidak berjalan berulang kali
        window.removeEventListener('click', activateAutoplay);
        window.removeEventListener('touchstart', activateAutoplay);
    }

    // Pasang detektor interaksi di layar
    window.addEventListener('click', activateAutoplay);
    window.addEventListener('touchstart', activateAutoplay);
</script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyB5rehbT0__gyIJ0NQPjLy5bWRwGNzpWjA",
            authDomain: "memory-of-my-love.firebaseapp.com",
            projectId: "memory-of-my-love",
            storageBucket: "memory-of-my-love.firebasestorage.app",
            messagingSenderId: "360013686813",
            appId: "1:360013686813:web:4a435f1041e047fda6bef4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const memoriesCollection = collection(db, "memories");

        let currentImageData = "";

        // Fungsi Animasi Hati
        function createHeart() {
            const container = document.getElementById('heart-container');
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = ['❤️', '💖', '🌸', '✨', '☁️'][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
            container.appendChild(heart);
            setTimeout(() => heart.remove(), 10000);
        }
        setInterval(createHeart, 800);

        // Fungsi Kompresi
        async function compressImage(base64Str) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.6));
                };
            });
        }

        window.switchView = function(view) {
            document.getElementById('home-view').classList.toggle('hidden', view !== 'home');
            document.getElementById('album-view').classList.toggle('hidden', view !== 'album');
            
            const navHome = document.getElementById('nav-home');
            const navAlbum = document.getElementById('nav-album');
            
            if(view === 'home') {
                navHome.classList.add('text-rose-500'); navHome.classList.remove('text-slate-400');
                navAlbum.classList.add('text-slate-400'); navAlbum.classList.remove('text-rose-500');
            } else {
                navAlbum.classList.add('text-rose-500'); navAlbum.classList.remove('text-slate-400');
                navHome.classList.add('text-slate-400'); navHome.classList.remove('text-rose-500');
                loadMemories();
            }
        }

        window.openModal = function(editId = null) {
            document.getElementById('modal-overlay').classList.remove('hidden');
            if(!editId) {
                document.getElementById('memory-form').reset();
                document.getElementById('image-preview').classList.add('hidden');
                document.getElementById('upload-placeholder').classList.remove('hidden');
                document.getElementById('edit-id').value = "";
                currentImageData = "";
            } else {
                const card = document.getElementById(`card-${editId}`);
                document.getElementById('edit-id').value = editId;
                document.getElementById('form-title').value = card.dataset.title;
                document.getElementById('form-date').value = card.dataset.date;
                document.getElementById('form-quote').value = card.dataset.quote;
                currentImageData = card.dataset.image;
                document.getElementById('image-preview').src = currentImageData;
                document.getElementById('image-preview').classList.remove('hidden');
                document.getElementById('upload-placeholder').classList.add('hidden');
            }
        }

        window.closeModal = () => document.getElementById('modal-overlay').classList.add('hidden');

        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = async (event) => {
                    currentImageData = await compressImage(event.target.result);
                    document.getElementById('image-preview').src = currentImageData;
                    document.getElementById('image-preview').classList.remove('hidden');
                    document.getElementById('upload-placeholder').classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        async function loadMemories() {
            const albumView = document.getElementById('album-view');
            albumView.innerHTML = '<div class="col-span-full text-center py-10"><span class="animate-spin inline-block">💖</span> Memuat Kenangan...</div>';
            
            try {
                const q = query(memoriesCollection, orderBy("date", "desc"));
                const querySnapshot = await getDocs(q);
                
                let htmlContent = "";
                const decorations = ['🍭', '🎀', '🧸', '💌', '⭐'];
                
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const randomDecor = decorations[Math.floor(Math.random() * decorations.length)];
                    
                    htmlContent += `
                        <div class="relative bg-white p-4 polaroid-frame rounded-sm group" id="card-${docSnap.id}" data-title="${data.title}" data-date="${data.date}" data-quote="${data.quote}" data-image="${data.image}">
                            <span class="absolute -top-3 -right-3 text-2xl z-20 group-hover:scale-125 transition-transform">${randomDecor}</span>
                            
                            <div class="aspect-square mb-4 overflow-hidden rounded-sm bg-slate-100">
                                <img src="${data.image}" class="w-full h-full object-cover grayscale-[20%] hover:grayscale-0 transition-all duration-500">
                            </div>
                            
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-bold text-slate-800 uppercase tracking-tight text-sm">${data.title}</h3>
                                    <p class="text-[10px] font-bold text-rose-300">${data.date}</p>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="openModal('${docSnap.id}')" class="p-2 bg-slate-50 hover:bg-rose-50 rounded-xl transition-colors">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-400 hover:text-rose-500"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
                                    </button>
                                    <button onclick="window.deleteMem('${docSnap.id}')" class="p-2 bg-slate-50 hover:bg-rose-50 rounded-xl transition-colors">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-400 hover:text-rose-500"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                                    </button>
                                </div>
                            </div>
                            <div class="mt-4 pt-3 border-t border-dashed border-rose-100">
                                <p class="italic text-sm text-slate-500 leading-relaxed font-light">"${data.quote}"</p>
                            </div>
                        </div>`;
                });
                albumView.innerHTML = htmlContent || '<div class="col-span-full text-center py-20 opacity-40">Belum ada foto. Yuk tambah momen pertama kita! 🥰</div>';
            } catch (err) {
                albumView.innerHTML = '<div class="col-span-full text-center text-rose-500">Error loading data. Check console.</div>';
                console.error(err);
            }
        }

        window.deleteMem = async (id) => {
            if(confirm('Hapus kenangan indah ini? 🥺')) { 
                await deleteDoc(doc(db, "memories", id)); 
                loadMemories(); 
            }
        }

        document.getElementById('memory-form').onsubmit = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "SEDANG MENYIMPAN... ✨"; btn.disabled = true;

            const id = document.getElementById('edit-id').value;
            const data = {
                title: document.getElementById('form-title').value,
                date: document.getElementById('form-date').value,
                quote: document.getElementById('form-quote').value,
                image: currentImageData
            };

            try {
                if(!currentImageData) throw new Error("Pilih foto dulu ya!");
                
                if(id) await updateDoc(doc(db, "memories", id), data);
                else await addDoc(memoriesCollection, data);
                
                closeModal(); 
                switchView('album');
            } catch (err) {
                alert(err.message || "Gagal simpan! Cek koneksi internet atau Rules Firebase lo.");
            } finally {
                btn.innerText = "SIMPAN KENANGAN ✨"; btn.disabled = false;
            }
        };
    </script>
</body>
</html>
